# https://github.com/prometheus/node_exporter
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      containers:
        - command:
            - node_exporter
            - --web.listen-address=:9100
            - --path.rootfs=/host
            - --path.sysfs=/host/sys
            - --path.procfs=/host/proc
            - --path.udev.data=/host/run/udev/data
          image: quay.io/prometheus/node-exporter:v1.11.1
          livenessProbe:
            httpGet:
              path: /
              port: metrics
          name: node-exporter
          ports:
            - containerPort: 9100
              name: metrics
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /host
              mountPropagation: HostToContainer
              name: host
              readOnly: true
      hostNetwork: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
        - hostPath:
            path: /
          name: host
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/name: node-exporter
  name: node-exporter
spec:
  ports:
    - name: metrics
      port: 9100
  selector:
    app.kubernetes.io/name: node-exporter
