# https://github.com/NVIDIA/dcgm-exporter
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-dcgm-exporter
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-dcgm-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-dcgm-exporter
    spec:
      containers:
        - command:
            - dcgm-exporter
            - --address=:9400
            - --kubernetes
          image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-distroless
          livenessProbe:
            httpGet:
              path: /
              port: metrics
          name: nvidia-dcgm-exporter
          ports:
            - containerPort: 9400
              name: metrics
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          securityContext:
            capabilities:
              add: [SYS_ADMIN]
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/lib/kubelet/pod-resources
              name: pod-gpu-resources
              readOnly: true
      hostNetwork: false
      nodeSelector:
        kubernetes.io/os: linux
        nvidia.com/gpu.present: "true"
      volumes:
        - hostPath:
            path: /var/lib/kubelet/pod-resources
          name: pod-gpu-resources
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/name: nvidia-dcgm-exporter
  name: nvidia-dcgm-exporter
spec:
  ports:
    - name: metrics
      port: 9400
  selector:
    app.kubernetes.io/name: nvidia-dcgm-exporter
